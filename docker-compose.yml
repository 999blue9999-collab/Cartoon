# Cartoon Studio — local n8n + episode assembler
#
# Run:  docker compose up -d
# Then open n8n (http://localhost:5678), import the two workflow files in
# workflows/, fill in the Config node values and credentials, and execute.
version: "3.8"

services:
  n8n:
    image: n8nio/n8n:1
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - GENERIC_TIMEZONE=Asia/Kolkata
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    volumes:
      - n8n_data:/home/node/.n8n

  episode-assembler:
    build:
      context: .
      dockerfile: services/episode-assembler/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - FFMPEG_ENABLED=true
      - PUBLIC_BASE_URL=http://localhost:5678  # adjust to your public URL if n8n must fetch outputs
    volumes:
      - assembler_output:/output

volumes:
  n8n_data:
  assembler_output:
