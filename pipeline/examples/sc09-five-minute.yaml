# relative, so resolve them with:
#
#   python -m pipeline build \
#     --config pipeline/examples/sc09-five-minute.yaml \
#     --assets-dir /projects/sandbox/golu_project \
#     --out-dir /tmp/sc09-out
#
# NOTE: this renders a full 5:00 episode and is slow; use --validate-only for a
# quick check, or smoke-test.yaml for a fast end-to-end render.
