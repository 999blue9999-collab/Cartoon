name: Terraform

# OIDC-based deploy pipeline for the infra/ Terraform root module.
#
# Credentials model: NO long-lived AWS access keys are stored in this
# repository. The job exchanges the GitHub-issued OIDC token for short-lived
# STS credentials by assuming an IAM role (see bootstrap/). The only AWS
# identifiers referenced here are the deploy role ARN (a repository variable,
# not a secret) and the region, neither of which is sensitive.
#
# Behaviour:
#   - pull_request -> main : fmt -check, init, validate, plan   (no apply)
#   - push        -> main  : init, validate, plan, then apply   (gated to main)

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

# Least-privilege token permissions. id-token: write is required for OIDC;
# contents: read lets the job check out the repository. pull-requests: write
# lets the plan job post the plan summary back onto the PR.
permissions:
  id-token: write
  contents: read
  pull-requests: write

# Region and backend configuration are pinned here so no step has to guess.
# AWS_DEPLOY_ROLE_ARN is a repository variable (Settings -> Secrets and
# variables -> Actions -> Variables). Expected shape for this project:
#   arn:aws:iam::079184685437:role/golu-prod-github-deploy
env:
  AWS_REGION: ap-south-1
  TF_STATE_BUCKET: golu-prod-tfstate-079184685437
  TF_STATE_KEY: infra/terraform.tfstate
  TF_STATE_DYNAMODB_TABLE: golu-prod-tfstate-lock
  TF_WORKING_DIR: infra

concurrency:
  # Serialize runs per ref so plan/apply never race on the same state lock.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Pull requests: validate and plan only. Never applies.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_DYNAMODB_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

  # ---------------------------------------------------------------------------
  # Pushes to main (i.e. a merged PR): plan then apply. Gated to main only.
  # ---------------------------------------------------------------------------
  apply:
    name: Apply (merge to main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_DYNAMODB_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -no-color -auto-approve tfplan
